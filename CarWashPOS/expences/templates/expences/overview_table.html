{% load l10n %}
{% load i18n %}
<table class="table table-sm">
    <thead>
        <tr>
            <th scope="col" class="text-center">Amount</th>
            <th scope="col" class="text-center w-50">Details</th>
            <th scope="col" class="text-center">
                <i class="bi bi-trash3-fill"></i>
            </th>
        </tr>
    </thead>
    <tbody class="table-group-divider">
        {% for cost in costs %}
            <tr>
                <td class="text-end">{{ cost.amount|unlocalize }}</td>
                <td class="text-center">{{ cost.details }}</td>
                <td class="text-center">
                    <a type="button"
                       class="btn btn-danger btn-sm"
                       role="button"
                       href="{% url 'Costs:delete' cost.id %}">
                        <i class="bi bi-trash3-fill"></i></a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
